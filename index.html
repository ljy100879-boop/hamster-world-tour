<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>햄스터 월드 투어</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 시작 화면 -->
  <main id="start-screen" class="screen">
    <div class="start-card">
      <div class="start-hero" id="start-hero"></div>
      <h1 class="logo">햄스터 월드 투어</h1>
      <p class="tagline">골든 햄스터들과 세계 수도를 사고팔며 해바라기씨 부자가 되어 보세요!</p>

      <section class="start-section">
        <h2>내 햄스터</h2>
        <div id="hamster-pick" class="hamster-pick"></div>
      </section>

      <section class="start-section row-2">
        <label class="field">
          <span>내 이름</span>
          <input id="player-name" type="text" maxlength="8" value="나">
        </label>
        <div class="field">
          <span>컴퓨터 수</span>
          <div class="seg" id="ai-count">
            <button type="button" data-v="1">1</button>
            <button type="button" data-v="2">2</button>
            <button type="button" data-v="3" class="on">3</button>
          </div>
        </div>
      </section>

      <section class="start-section">
        <div class="field">
          <span>컴퓨터 난이도</span>
          <div class="seg" id="ai-diff">
            <button type="button" data-v="easy">쉬움</button>
            <button type="button" data-v="normal" class="on">보통</button>
            <button type="button" data-v="hard">어려움</button>
          </div>
        </div>
      </section>

      <details class="start-section options">
        <summary>추가 규칙 (선택)</summary>
        <label class="check"><input type="checkbox" id="opt-jackpot"> 텔레포트 칸 상금 (세금·벌금을 모아 도착한 햄스터가 수령)</label>
        <label class="check"><input type="checkbox" id="opt-go400"> 출발 칸에 정확히 도착하면 🌻400</label>
        <label class="check"><input type="checkbox" id="opt-limit"> 턴 제한
          <select id="opt-limit-n"><option>20</option><option selected>30</option><option>50</option></select>바퀴 후 총자산 1위 승리</label>
      </details>

      <div class="start-buttons">
        <button id="btn-start" class="btn primary big">게임 시작 🎲</button>
        <button id="btn-continue" class="btn big hidden">이어하기</button>
      </div>
    </div>
  </main>

  <!-- 게임 화면 -->
  <main id="game-screen" class="screen hidden">
    <div class="layout">
      <div class="board-wrap">
        <div id="board" class="board">
          <div class="center">
            <div class="center-inner">
              <div class="center-logo">햄스터 월드 투어</div>
              <div class="dice" id="dice"><div class="die" data-v="1"></div><div class="die" data-v="1"></div></div>
              <div class="power" id="power"><i></i><span>힘</span></div>
              <div class="roll-result" id="roll-result"></div>
              <button type="button" id="roll-btn" class="roll-btn hidden" tabindex="-1">
                <span class="rb-ico"><img src="assets/dice/face5.png" alt="🎲" onerror="this.replaceWith(document.createTextNode(this.alt))"></span>
                <span class="rb-txt">꾹 눌러 굴리기</span>
              </button>
              <div class="center-info" id="center-info"></div>
              <div class="deck-row">
                <div class="deck chance"><img src="assets/icons/sunflower.png" alt="🌻"><span>찬스</span></div>
                <div class="deck chest"><img src="assets/icons/hamster.png" alt="🐹"><span>볼주머니</span></div>
              </div>
            </div>
          </div>
          <div id="buildings" class="buildings"></div>
          <div id="tokens" class="tokens"></div>
        </div>
      </div>
      <aside class="side">
        <div class="toolbar">
          <button class="btn small" id="btn-manage">🏠 내 땅 관리</button>
          <button class="btn small" id="btn-trade">🤝 거래</button>
          <button class="btn small icon" id="btn-fast" title="컴퓨터 턴 빨리 감기">⏩</button>
          <button class="btn small icon" id="btn-music" title="배경음악 켜기/끄기">🎵</button>
          <button class="btn small icon" id="btn-sound" title="효과음 켜기/끄기">🔊</button>
          <button class="btn small icon" id="btn-menu" title="메뉴">☰</button>
        </div>
        <div id="players" class="players"></div>
        <div id="actions" class="panel actions"></div>
        <div class="panel log-panel">
          <h3>게임 기록</h3>
          <div id="log" class="log"></div>
        </div>
      </aside>
    </div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/questions.js"></script>
  <script src="js/hamster.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
